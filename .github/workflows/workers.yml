name: Workers API

on:
  push:
    branches: [master]
    paths:
      - '*.json'
      - 'workers/**'
      - '.github/workflows/workers.yml'
  pull_request:
    paths:
      - '*.json'
      - 'workers/**'
      - '.github/workflows/workers.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'
  # Updates pushed with GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: workers-api-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' && vars.SYNC_UPSTREAM != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Merge upstream without rewriting local history
        env:
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'NateScarlet/holiday-cn' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/${UPSTREAM_REPOSITORY}.git" master
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:master

  validate:
    needs: sync
    if: >-
      always() && !cancelled() &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # CI may have committed newer JSON after the triggering commit.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate JSON and test API
        working-directory: workers
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-source
          path: workers/

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'holiday-cn-api' }}
      CLOUDFLARE_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_CUSTOM_DOMAINS }}
      CLOUDFLARE_ROUTES: ${{ vars.CLOUDFLARE_ROUTES }}
      CLOUDFLARE_WORKERS_DEV: ${{ vars.CLOUDFLARE_WORKERS_DEV }}
    steps:
      - name: Check Cloudflare configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. See workers/README.md."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worker-source
          path: workers
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Install locked deployment tool
        working-directory: workers
        run: npm ci
      - name: Publish tested Worker bundle
        working-directory: workers
        run: |
          node deploy-config.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy.json --name "$WORKER_NAME"
